[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S106"]
"migrations/*" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["app"]
