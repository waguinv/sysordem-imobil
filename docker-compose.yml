services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imobil}
      POSTGRES_USER: ${POSTGRES_USER:-imobil_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      APP_DB_ROLE: ${APP_DB_ROLE:-imobil_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobil_owner} -d ${POSTGRES_DB:-imobil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  migrate:
    build: ./apps/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-imobil_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imobil}
      APP_DB_ROLE: ${APP_DB_ROLE:-imobil_app}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_ROLE:-imobil_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-imobil}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PAYMENTS_SANDBOX_SECRET: ${PAYMENTS_SANDBOX_SECRET:-}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
networks:
  internal:
