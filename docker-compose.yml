services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imobil}
      POSTGRES_USER: ${POSTGRES_USER:-imobil_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      APP_DB_ROLE: ${APP_DB_ROLE:-imobil_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobil_owner} -d ${POSTGRES_DB:-imobil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  migrate:
    build: ./apps/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-imobil_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imobil}
      APP_DB_ROLE: ${APP_DB_ROLE:-imobil_app}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_ROLE:-imobil_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-imobil}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_FORMAT: ${LOG_FORMAT:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      PAYMENTS_SANDBOX_SECRET: ${PAYMENTS_SANDBOX_SECRET:-}
      # Assinatura eletrônica (opcional): Documenso auto-hospedado — ver docs/ASSINATURA_ELETRONICA.md
      DOCUMENSO_URL: ${DOCUMENSO_URL:-}
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:-}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:-}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  # ── Assinatura eletrônica (opcional): docker compose --profile assinatura up ──
  documenso-db:
    profiles: [assinatura]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:-}
    volumes:
      - documenso_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  documenso:
    profiles: [assinatura]
    # Fixe uma versão testada em produção (ex.: documenso/documenso:v1.13.2)
    image: ${DOCUMENSO_IMAGE:-documenso/documenso:latest}
    environment:
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:-http://localhost:3005}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD:-}@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD:-}@documenso-db:5432/documenso
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${SMTP_HOST:-}
      NEXT_PRIVATE_SMTP_PORT: ${SMTP_PORT:-587}
      NEXT_PRIVATE_SMTP_USERNAME: ${SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SysOrdem Imobil}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
    volumes:
      # certificado .p12 que sela os PDFs assinados (ver docs/ASSINATURA_ELETRONICA.md)
      - ${DOCUMENSO_CERT_PATH:-./docker/documenso/cert.p12}:/opt/documenso/cert.p12:ro
    ports: ["${DOCUMENSO_PORT:-3005}:3000"]
    depends_on:
      documenso-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  documenso_data:
networks:
  internal:
