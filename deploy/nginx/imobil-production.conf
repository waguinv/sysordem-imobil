# SysOrdem Imobil — PRODUÇÃO (nginx do servidor). Instalação em docs/CI_CD.md:
#   sudo cp deploy/nginx/imobil-production.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/imobil-production.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d imobil.sysordemsistemas.com.br -d api.imobil.sysordemsistemas.com.br --redirect
# O certbot acrescenta o bloco 443 (certificado) e o redirecionamento http -> https.
# Portas internas (127.0.0.1) iguais a WEB_HOST_PORT/API_HOST_PORT do .env de /opt/sysordem-imobil.

upstream imobil_prod_web { server 127.0.0.1:3100; keepalive 16; }
upstream imobil_prod_api { server 127.0.0.1:8100; keepalive 8; }

# Sistema (web/BFF): tudo passa por aqui.
server {
    listen 80;
    listen [::]:80;
    server_name imobil.sysordemsistemas.com.br;

    client_max_body_size 6m;   # extrato OFX/CSV de até 2 MB por Server Action
    server_tokens off;

    location / {
        proxy_pass http://imobil_prod_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# API pública: SÓ webhooks dos provedores e /health. O resto da API é acessado pelo web, por dentro.
server {
    listen 80;
    listen [::]:80;
    server_name api.imobil.sysordemsistemas.com.br;

    client_max_body_size 1m;
    server_tokens off;

    location /api/v1/webhooks/ {
        proxy_pass http://imobil_prod_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP real do provedor (limite de taxa da API)
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass http://imobil_prod_api;
    }
    location / {
        return 404;
    }
}
