name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imobil_owner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imobil_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://imobil_owner:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
      # Rollback de schema: upgrade head -> downgrade base -> upgrade head + RLS forçado em tudo
      - name: Migrations (ida e volta)
        run: python -m scripts.check_migrations
      - name: Vulnerabilidades conhecidas nas dependências
        run: pip install pip-audit && pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vulnerabilidades conhecidas (dependências de produção)
        run: npm audit --omit=dev --audit-level=high

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Segredos vazados no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scripts de shell
        run: shellcheck deploy/*.sh docker/db/init/*.sh
      - name: Compose (dev, perfil assinatura e deploy)
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile assinatura config -q
          IMAGE_TAG=ci WEB_HOST_PORT=3710 API_HOST_PORT=8710 \
            docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.deploy.yml config -q
      - name: Sites do nginx (sintaxe)
        run: docker run --rm -v "$PWD/deploy/nginx:/etc/nginx/conf.d:ro" nginx:1.28-alpine nginx -t
      - name: Build das imagens
        run: |
          docker build -t imobil-api:ci apps/api
          docker build -t imobil-web:ci apps/web
      - name: Varredura das imagens (CVEs críticas com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: imobil-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: imobil-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Fase 6b: sobe a pilha real (compose), gera dados pela API sob carga (com teste de corrida na reserva),
  # faz backup com deploy/backup.sh, restaura com deploy/restore.sh num banco novo e confere linha a linha.
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: .env de teste (segredos aleatórios)
        run: |
          cp .env.example .env
          while grep -q 'CHANGE_ME' .env; do
            sed -i "0,/CHANGE_ME[A-Z0-9_]*/s//ci$(openssl rand -hex 24)/" .env
          done
          openssl rand -base64 48 > "$RUNNER_TEMP/backup.key"
          sed -i "s|^BACKUP_KEY_FILE=.*|BACKUP_KEY_FILE=$RUNNER_TEMP/backup.key|; s|^BACKUP_DIR=.*|BACKUP_DIR=$RUNNER_TEMP/backups|" .env
      - name: Subir banco, migrations e API
        run: |
          docker compose up -d --build --wait api
          docker compose run --rm migrate python -m scripts.seed_dev
      - name: Carga + corrida de reservas
        working-directory: apps/api
        env:
          LOAD_PASSWORD: imobil-dev-123
        run: |
          pip install "httpx>=0.27,<1.0"
          python -m scripts.load_test --users 10 --duration 20 --max-p95-ms 2000 --json "$RUNNER_TEMP/carga.json"
      - name: Backup criptografado
        run: deploy/backup.sh ci
      - name: Restauração num banco novo
        run: deploy/restore.sh "$(ls "$RUNNER_TEMP"/backups/*.dump.enc)" imobil_restore_ci
      - name: Conferir restauração (linhas, RLS, políticas)
        run: docker compose run --rm migrate python -m scripts.verify_restore --source imobil --target imobil_restore_ci
      - name: Backup no disco está cifrado (não é um dump legível)
        run: |
          f="$(ls "$RUNNER_TEMP"/backups/*.dump.enc)"
          if head -c 5 "$f" | grep -q PGDMP; then echo "backup gravado sem criptografia!"; exit 1; fi
          [ "$(stat -c %a "$f")" = "600" ] || { echo "permissão do backup: $(stat -c %a "$f")"; exit 1; }
      - name: Cópia fora do servidor (rclone num destino local) e aviso ao monitor
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          remote="$RUNNER_TEMP/offsite"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > "$RUNNER_TEMP/monitor.log" 2>&1 &
          sleep 1
          sed -i "s|^BACKUP_RCLONE_REMOTE=.*|BACKUP_RCLONE_REMOTE=$remote|" .env
          echo "BACKUP_HEALTHCHECK_URL=http://127.0.0.1:8765/hc" >> .env
          # 1) backup diário envia o de hoje E o que tinha ficado para trás (o "ci" do passo anterior)
          deploy/backup.sh
          n_local="$(find "$RUNNER_TEMP/backups" -name '*.dump.enc' | wc -l)"
          n_remote="$(find "$remote" -name '*.dump.enc' | wc -l)"
          [ "$n_local" = 2 ] && [ "$n_remote" = 2 ] || { echo "esperado 2/2, veio $n_local/$n_remote"; exit 1; }
          (cd "$remote" && sha256sum -c --quiet ./*.sha256)
          grep -q 'GET /hc ' "$RUNNER_TEMP/monitor.log" || { echo "monitor não recebeu o sucesso"; exit 1; }
          # 2) rodar de novo não muda nada
          deploy/offsite_backup.sh
          # 3) backup que sumiu do destino é reenviado
          rm "$(find "$remote" -name '*.dump.enc' | head -1)"
          deploy/offsite_backup.sh
          [ "$(find "$remote" -name '*.dump.enc' | wc -l)" = 2 ] || { echo "não reenviou"; exit 1; }
          # 4) cópia adulterada no destino: não sobrescreve, falha — e o backup diário avisa a falha
          echo lixo >> "$(find "$remote" -name '*.dump.enc' | head -1)"
          if deploy/offsite_backup.sh; then echo "aceitou cópia adulterada no destino!"; exit 1; fi
          if deploy/backup.sh; then echo "backup não acusou a falha da cópia externa!"; exit 1; fi
          grep -q 'GET /hc/fail ' "$RUNNER_TEMP/monitor.log" || { echo "monitor não recebeu a falha"; exit 1; }
      - name: Monitor do servidor (API, /ops/status, disco, backups) e aviso ao serviço de alertas
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > "$RUNNER_TEMP/alertas.log" 2>&1 &
          sleep 1
          echo "MONITOR_HEALTHCHECK_URL=http://127.0.0.1:8766/mon" >> .env
          # tudo bem: API pronta, /ops/status com o token do .env, backup recente, cópia externa conferida
          deploy/monitor.sh
          grep -q 'POST /mon ' "$RUNNER_TEMP/alertas.log" || { echo "monitor não avisou o sucesso"; exit 1; }
          # problema (limite de disco impossível): sai com erro e avisa a falha
          if MONITOR_DISK_MAX_PCT=1 deploy/monitor.sh; then echo "monitor não acusou o disco"; exit 1; fi
          grep -q 'POST /mon/fail ' "$RUNNER_TEMP/alertas.log" || { echo "monitor não avisou a falha"; exit 1; }
      - if: always()
        run: docker compose logs --tail=100 api
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga
          path: ${{ runner.temp }}/carga.json
          if-no-files-found: ignore
