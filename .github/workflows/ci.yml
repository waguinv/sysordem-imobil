name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imobil_owner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imobil_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://imobil_owner:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
      # Rollback de schema: upgrade head -> downgrade base -> upgrade head + RLS forçado em tudo
      - name: Migrations (ida e volta)
        run: python -m scripts.check_migrations
      - name: Vulnerabilidades conhecidas nas dependências
        run: pip install pip-audit && pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vulnerabilidades conhecidas (dependências de produção)
        run: npm audit --omit=dev --audit-level=high

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Segredos vazados no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scripts de shell
        run: shellcheck deploy/*.sh docker/db/init/*.sh
      - name: Compose (dev, perfil assinatura e deploy)
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile assinatura config -q
          IMAGE_TAG=ci WEB_DOMAIN=app.exemplo.test API_DOMAIN=api.exemplo.test \
            docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.deploy.yml config -q
      - name: Build das imagens
        run: |
          docker build -t imobil-api:ci apps/api
          docker build -t imobil-web:ci apps/web
      - name: Varredura das imagens (CVEs críticas com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: imobil-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: imobil-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
