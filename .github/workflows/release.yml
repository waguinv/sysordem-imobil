name: Release e deploy

# main -> publica imagens no GHCR (tag = sha do commit) -> deploy automático em STAGING.
# Produção e rollback: manual (Actions -> "Release e deploy" -> Run workflow), com aprovação do
# environment "production" configurada no GitHub. Ver docs/CI_CD.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Onde implantar"
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: "Tag da imagem (sha-xxxxxxx). Vazio = commit atual"
        required: false
      rollback:
        description: "Rollback: troca as imagens sem rodar migrations"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  images:
    # não constrói nada em rollback nem quando uma tag já publicada foi informada
    if: >-
      github.event_name == 'push' ||
      (github.event.inputs.image_tag == '' && github.event.inputs.rollback != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/sysordem-imobil-api:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/sysordem-imobil-web:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    # roda também quando "images" foi pulado (deploy/rollback de uma tag já publicada)
    if: >-
      always() && (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Tag a implantar
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          BUILT_TAG: ${{ needs.images.outputs.tag }}
          ROLLBACK: ${{ github.event.inputs.rollback }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          # rollback sem tag = volta para a versão anterior registrada no servidor
          if [ "$ROLLBACK" = "true" ] && [ -z "$tag" ]; then echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$tag" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "tag inválida: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # host conhecido fixado no secret: nada de aceitar a chave na primeira conexão
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_DIR }}
          TAG: ${{ steps.tag.outputs.tag }}
          ROLLBACK: ${{ github.event.inputs.rollback == 'true' && '--rollback' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "cd '$DIR' && git fetch --quiet origin && git checkout --quiet --detach '${GITHUB_SHA}' && deploy/deploy.sh $ROLLBACK $TAG"
